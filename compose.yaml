name: edocs

services:
  frontend:
    build: 
      context: edocs
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  
  app:
    build: 
      context: node
      dockerfile: Dockerfile
      
    ports:
      - "5000:5000"
    
    environment:
      - NODE_ENV=production

    restart: unless-stopped